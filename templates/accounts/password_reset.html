{% extends "base.html" %}
{% block title %}Forgot password &middot; ECO-LINK{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card shadow-sm border-0">
      <div class="card-body p-4">
        <h4 class="mb-1" style="color:#14532d;">Forgot your password?</h4>
        <p class="text-muted small mb-4">
          Enter your email and we'll send you a link to reset it.
        </p>
        <form method="post" class="auth-form" novalidate>
          {% csrf_token %}
          {{ form.as_p }}
          <button type="submit" class="btn btn-success w-100 mt-2">Send reset link</button>
        </form>
        <p class="text-center text-muted small mt-3 mb-0">
          <a href="{% url 'login' %}">Back to log in</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
