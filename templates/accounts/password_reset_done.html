{% extends "base.html" %}
{% block title %}Reset link sent &middot; ECO-LINK{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card shadow-sm border-0">
      <div class="card-body p-4 text-center">
        <div class="display-6">📧</div>
        <h4 class="mb-2" style="color:#14532d;">Check your email</h4>
        <p class="text-muted">
          If an account exists for that email, we've sent a link to reset your
          password. Follow the link in the email to choose a new one.
        </p>
        <a href="{% url 'login' %}" class="btn btn-success">Back to log in</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
