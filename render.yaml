# Render Blueprint for ECO-LINK — https://render.com
# In Render: New + -> Blueprint -> connect this repo. Render reads this file and
# creates a PostgreSQL database and a web service, wiring them together.

databases:
  - name: ecolink-db
    databaseName: ecolink_db
    plan: free

services:
  - type: web
    name: ecolink
    runtime: python
    plan: free
    buildCommand: >-
      pip install -r requirements.txt &&
      python manage.py collectstatic --no-input &&
      python manage.py migrate
    startCommand: "gunicorn ecolink.wsgi:application"
    envVars:
      # Database connection is injected from the managed PostgreSQL above.
      - key: DATABASE_URL
        fromDatabase:
          name: ecolink-db
          property: connectionString
      # A strong secret key is generated by Render automatically.
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      # Render serves the app on <name>.onrender.com; the leading dot matches it.
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: WEB_CONCURRENCY
        value: "4"
